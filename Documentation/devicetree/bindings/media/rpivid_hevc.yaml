%YAML 1.2
---
$id: http://devicetree.org/schemas/media/rpivid_hevc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Raspberry Pi HEVC Decoder

maintainers:
  - Raspberry Pi <kernel-list@raspberrypi.com>

description: |-
  The Camera Adaptation Layer (CAL) is a key component for image capture
  applications. The capture module provides the system interface and the
  processing capability to connect CSI2 image-sensor modules to the
  DRA72x device.

properties:
  compatible:
    enum:
      - raspberrypi,rpivid-vid-decoder

  reg:
    items:
      - description: The HEVC main register region
      - description: The Interrupt controller register region

  reg-names:
    items:
      - const: hevc
      - const: intc

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: The HEVC block clock

  clock-names:
    items:
      - const: hevc

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <1>;

        video-codec@7eb00000 {
            compatible = "raspberrypi,rpivid-vid-decoder";
            reg = <0x0 0x7eb00000 0x10000>,
                  <0x0 0x7eb10000 0x1000>;
            reg-names = "hevc",
                        "intc";

            interrupts = <GIC_SPI 98 IRQ_TYPE_LEVEL_HIGH>;

            clocks = <&clk 0>;
            clock-names = "hevc";
        };
    };

...
