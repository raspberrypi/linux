%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx662.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX662 CMOS Image Sensor

maintainers:
  - Dave Stevenson <dave.stevenson@raspberrypi.com>

description:
  The Sony IMX662 is a 1/2.8-inch CMOS image sensor with a pixel
  array of 1936x1100 pixels, capable of up to 90 fps.
  It supports MIPI CSI-2 output with 2 or 4 data lanes,
  RAW10/RAW12 output, and both colour and monochrome variants.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    enum:
      - sony,imx662aaqr  # Colour variant
      - sony,imx662aamr  # Monochrome variant

  reg:
    maxItems: 1
    description: I2C device address

  clocks:
    maxItems: 1
    description: Master clock input (xclk).

  reset-gpios:
    maxItems: 1
    description: Sensor reset (XCLR) pin, active low (optional).

  avdd-supply:
    description: Analog 3.3V power supply (optional).

  dvdd-supply:
    description: Digital core 1.1V power supply (optional).

  ovdd-supply:
    description: Digital I/O 1.8V power supply (optional).

  orientation: true
  rotation: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    description: CSI-2 transmitter port
    additionalProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          data-lanes:
            description: Number of MIPI CSI-2 data lanes (must be 2 or 4)
            minItems: 2
            maxItems: 4
            items:
              enum: [1, 2, 3, 4]

          link-frequencies:
            description: Allowed MIPI link frequencies in Hz
            minItems: 1
            maxItems: 8
            items:
              enum: [297000000, 360000000, 445500000, 594000000,
                     720000000, 891000000, 1039500000, 1188000000]
        required:
          - data-lanes
          - link-frequencies
    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@1a {
            compatible = "sony,imx662aaqr";
            reg = <0x1a>;
            pinctrl-names = "default";
            pinctrl-0 = <&pinctrl_cam>;
            clocks = <&clk24m>;
            avdd-supply = <&reg_cam_avdd>;
            dvdd-supply = <&reg_cam_dvdd>;
            ovdd-supply = <&reg_cam_ovdd>;
            reset-gpios = <&gpio3 4 GPIO_ACTIVE_LOW>;

            port {
                imx662_out: endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <360000000>;
                    remote-endpoint = <&imx662_in>;
                };
            };
        };
    };
...
