%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/panel-dsi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Generic MIPI DSI Panel

maintainers:
  - Timon Skerutsch <kernel@diodes-delight.com>

properties:
  compatible:
    description:
      Shall contain a panel specific compatible and "panel-dsi"
      in that order.
    items:
      - {}
      - const: panel-dsi

  dsi-color-format:
    description: |
      The color format used by the panel. Only DSI supported formats are allowed.
    enum:
      - RGB888
      - RGB666
      - RGB666_PACKED
      - RGB565

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false
    description:
      Panel MIPI DSI input

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes: true

        required:
          - data-lanes

  mode:
    description: |
      DSI mode flags. See DSI Specs for details.
      These are driver independent features of the DSI bus.
    $ref: /schemas/types.yaml#/definitions/string-array
    items:
      enum:
        - MODE_VIDEO
        - MODE_VIDEO_BURST
        - MODE_VIDEO_SYNC_PULSE
        - MODE_VIDEO_AUTO_VERT
        - MODE_VIDEO_HSE
        - MODE_VIDEO_NO_HFP
        - MODE_VIDEO_NO_HBP
        - MODE_VIDEO_NO_HSA
        - MODE_VSYNC_FLUSH
        - MODE_NO_EOT_PACKET
        - CLOCK_NON_CONTINUOUS
        - MODE_LPM
        - HS_PKT_END_ALIGNED

  reg:
    maxItems: 1

  backlight:
    $ref: panel-common.yaml#/properties/backlight

  enable-gpios:
    $ref: panel-common.yaml#/properties/enable-gpios

  width-mm: true

  height-mm: true

  panel-timing:
    $ref: panel-common.yaml#/properties/panel-timing

  power-supply: true

  reset-gpios:
    $ref: panel-common.yaml#/properties/reset-gpios

  ddc-i2c-bus:
    $ref: panel-common.yaml#/properties/ddc-i2c-bus

required:
  - panel-timing
  - reg
  - power-supply
  - dsi-color-format
  - port

additionalProperties: false

examples:
  - |
    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "panel-mfgr,generic-dsi-panel","panel-dsi";
            power-supply = <&vcc_supply>;
            backlight = <&backlight>;
            dsi-color-format = "RGB888";
            reg = <0>;
            mode = "MODE_VIDEO", "MODE_VIDEO_BURST", "MODE_NO_EOT_PACKET";

            port {
                panel_dsi_port: endpoint {
                    data-lanes = <1 2>;
                    remote-endpoint = <&dsi_out>;
                };
            };

            panel-timing {
                clock-frequency = <9200000>;
                hactive = <800>;
                vactive = <480>;
                hfront-porch = <8>;
                hback-porch = <4>;
                hsync-len = <41>;
                vback-porch = <2>;
                vfront-porch = <4>;
                vsync-len = <10>;
            };
        };

    };

...
