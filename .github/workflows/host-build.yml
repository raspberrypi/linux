---

name: Build RasPi Kernel (Native)

on:
  workflow_dispatch:
    inputs:
      freespace:
        description: 'Clear Disk Space'
        required: true
        type: boolean
        default: false
      swapspace:
        description: 'Add Swap'
        required: true
        type: boolean
        default: false
      arch:
        description: 'Build Arch'
        required: true
        type: choice
        options:
          - arm
          - arm64
        default: arm64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 420
    runs-on: ubuntu-24.04-${{ inputs.arch }}
    defaults:
      run:
        shell: bash
        working-directory: /home/runner/work/linux/

    steps:
      - if: ${{ inputs.freespace }}
        name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          swap-storage: false
          large-packages: true
          tool-cache: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          #path: ${{ env.working-directory }}

      - name: Install cross-compilers and dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          execute_install_scripts: true
          packages: build-essential gcc-14 g++-14 flex bison libssl-dev device-tree-compiler cpio fakeroot lz4 rsync schedtool wget zstd lld pkg-config devscripts make debhelper ccache git bc kmod
          version: 1.1

      - name: Set gcc-14 as the default gcc
        run: |
            # Create symbolic links or use update-alternatives to make the gcc-14 compiler the default
            # This command creates a link from gcc-14 to the generic gcc name
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
            # Verify the change
            gcc --version

      - if: ${{ inputs.swapspace }}
        name: 𝔸𝕕𝕕 𝕤𝕨𝕒𝕡 𝕤𝕡𝕒𝕔𝕖
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 🅲🅲🅰🅲🅷🅴 🅴🅽🆅🅸🆁🅾🅽🅼🅴🅽🆃 🆅🅰🆁🅸🅰🅱🅻🅴🆂 
        run: |
          cat >> $GITHUB_ENV << 'EOF'
          CCACHE_SLOPPINESS=file_macro,locale,time_macros
          CCACHE_NOHASHDIR=true
          CCACHE_COMPRESS=1
          CCACHE_COMPRESSLEVEL=6
          CCACHE_DEPEND=1
          EOF
          echo "CCACHE Environment set!"
          
          # Set Compiler
          sudo ln -s /usr/bin/ccache /usr/local/bin/aarch64-linux-gnu-gcc
          sudo ln -s /usr/bin/ccache /usr/local/bin/aarch64-linux-gnu-g++
          sudo ln -s /usr/bin/ccache /usr/local/bin/arm-linux-gnueabihf-gcc
          sudo ln -s /usr/bin/ccache /usr/local/bin/arm-linux-gnueabihf-g++
          echo "CC=ccache gcc" >> $GITHUB_ENV
          echo "CXX=ccache g++" >> $GITHUB_ENV
          echo "CCACHE Compilers set!"

          # Setup CCACHE Dir
          sudo mkdir -p /mnt/ccache
          sudo chown -R $USER:$USER /mnt/ccache
          echo "CCACHE_DIR=/mnt/ccache" >> $GITHUB_ENV
          echo "CCACHE Dir Set!"
          df -h

      - name: Enable CCACHE
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: 'true'
          key: kernel-build-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('Makefile', 'arch/*/Makefile', '.config') }}
          max-size: '10000MB'
          restore-keys: |
            kernel-build-${{ runner.os }}-${{ inputs.arch }}-
            kernel-build-${{ runner.os }}-
          verbose: 2
          save: true

      - name: Set up build environment variables
        run: |
          # Set architecture
          echo "ARCH=${{ inputs.arch }}" >> $GITHUB_ENV
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            echo "KERNEL=kernel8" >> $GITHUB_ENV
          else
            echo "KERNEL=kernel7" >> $GITHUB_ENV
          fi
          # Set build directory
          echo "BUILD_DIR=$(pwd)/build_output" >> $GITHUB_ENV
          # Create output directories
          mkdir -p $(pwd)/build_output/boot
          mkdir -p $(pwd)/build_output/boot/overlays
          mkdir -p $(pwd)/build_output/lib/modules
          echo "Building for architecture: ${{ inputs.arch }}"
          echo "KBUILD_BUILD_TIMESTAMP=1970-01-01 00:00:00" >> $GITHUB_ENV
          echo "KBUILD_BUILD_VERSION=1" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          cd linux/

          if [ "${{ inputs.arch }}" = "arm64" ]; then
            cp pi4-upd.config .config
          else
            cp zero2w-upd.config .config
          fi

          make oldconfig
        env:
          ARCH: ${{ env.ARCH }}

      - name: Compile kernel image, modules, and DTBs
        run: |
          echo "Starting kernel build..."
          echo "Architecture: $ARCH"

          cd linux/

          # Use -j$(nproc) for parallel compilation
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            KBUILD_BUILD_TIMESTAMP='' make -j$(nproc) Image modules dtbs
          else
            KBUILD_BUILD_TIMESTAMP='' make -j$(nproc) zImage modules dtbs
          fi

          echo "Kernel compilation completed!"
        env:
          ARCH: ${{ env.ARCH }}

      - name: Install modules and copy artifacts
        run: |
          cd linux/
          # Install modules into a staging directory
          echo "Installing modules..."
          sudo make modules_install INSTALL_MOD_PATH=${{ env.BUILD_DIR }}

          # Copy kernel image
          echo "Copying kernel image..."
          cp arch/${{ env.ARCH }}/boot/Image ${{ env.BUILD_DIR }}/boot/${{ env.KERNEL }}.img

          # Copy DTBs (handle potential missing files gracefully)
          echo "Copying device tree blobs..."
          if [ -d "arch/${{ env.ARCH }}/boot/dts/broadcom" ]; then
            cp arch/${{ env.ARCH }}/boot/dts/broadcom/*.dtb ${{ env.BUILD_DIR }}/boot/ 2>/dev/null || echo "No DTB files found in broadcom directory"
          fi

          # Copy overlays (handle potential missing files gracefully)
          echo "Copying device tree overlays..."
          if [ -d "arch/${{ env.ARCH }}/boot/dts/overlays" ]; then
            cp arch/${{ env.ARCH }}/boot/dts/overlays/*.dtb* ${{ env.BUILD_DIR }}/boot/overlays/ 2>/dev/null || echo "No overlay files found"
          fi

          echo "Build artifacts:"
          ls -lh ${{ env.BUILD_DIR }}/boot/
          echo "Modules:"
          ls -lh ${{ env.BUILD_DIR }}/lib/modules/

          echo "Kernel build completed successfully!"
        env:
          ARCH: ${{ env.ARCH }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-raspberrypi-kernel-${{ inputs.arch }}
          path: ${{ env.BUILD_DIR }}/
          compression-level: 9
          retention-days: 30
